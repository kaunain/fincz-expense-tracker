name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Angular App
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Debug pnpm
        run: |
          pwd
          ls -la
          ls -la frontend
          node -v
          pnpm -v
          pnpm config list
          test -f pnpm-workspace.yaml && cat pnpm-workspace.yaml || echo "No workspace file"
          test -f .npmrc && cat .npmrc || echo "No .npmrc"

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Formatting
        run: pnpm format:check

      - name: Production Build
        run: pnpm build
